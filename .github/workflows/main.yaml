name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:

  actions:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout code
          uses: actions/checkout@v3
          with:
            submodules: recursive

        - name: Install Rust
          uses: actions-rs/toolchain@v1
          with:
            profile: minimal
            toolchain: stable
            components: rustfmt, clippy

        - name: Run rustfmt
          run: cargo fmt -- --check

        - name: Build wasm
          run: |
            rustup target add wasm32-unknown-unknown
            cargo clippy --target wasm32-unknown-unknown --verbose -- -D warnings

        - name: Build native
          run: cargo clippy --verbose -- -D warnings

        - name: Run tests
          run: cargo test --verbose